<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>YOOFAM · 외부 거래명세서 승인 확인</title><style>body{margin:0;background:#f2f5f9;font:15px/1.65 system-ui;color:#1d304b}main{padding:28px;max-width:650px;margin:auto}h1{font-size:23px;margin:0 0 14px}.card{background:white;border:1px solid #d7e0eb;border-radius:12px;padding:18px;margin:16px 0}.notice{color:#8b3c21;background:#fff3e6}li{margin:8px 0;overflow-wrap:anywhere}button{font:inherit;padding:12px 17px;border:1px solid #bac8d9;border-radius:8px;background:white;margin-right:8px;cursor:pointer}button.primary{background:#254e87;color:white;border-color:#254e87}button:disabled{opacity:.5;cursor:default}strong{overflow-wrap:anywhere}#status{white-space:pre-wrap}label{display:flex;gap:10px;align-items:flex-start}input{margin-top:6px}</style></head><body><main><h1>외부 거래명세서 승인</h1><p>이 창은 YOOFAM 운영 연결 확장의 별도 확인 창입니다.</p><div class="card"><div>현재 검증 회사코드</div><strong id="company">확인 중</strong><div>아래 발주번호에만 승인 요청을 보냅니다.</div><ol id="items"></ol></div><div class="card notice">Supplier Hub의 거래명세서 상태를 바꾸는 작업입니다. 승인 후 업무상 취소가 필요하면 Supplier Hub에서 확인해야 합니다. 불명 응답과 성공 항목은 자동으로 다시 승인하지 않습니다.</div><div class="card"><label><input id="understood" type="checkbox" disabled><span>회사코드와 모든 발주번호를 확인했으며, 이 거래명세서의 외부 승인을 직접 요청합니다.</span></label></div><button id="approve" class="primary" disabled>위 발주 거래명세서 승인</button><button id="cancel" disabled>취소</button><p id="status" role="status">승인 자료를 확인하고 있습니다.</p></main><script src="confirmation.js"></script></body></html>
