<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>YOOFAM 운영 연결</title><style>body{width:320px;margin:0;padding:22px;font:14px/1.7 system-ui;color:#20324b}h1{font-size:19px;margin:0 0 10px}p{margin:10px 0}.note{padding:12px;background:#eef4fb;border-radius:8px}a{color:#245f9c}</style></head><body><h1>YOOFAM 운영 연결</h1><p>소싱·재고·입고·매출·광고 자료를 읽는 별도 연결 확장입니다.</p><p class="note">YOOFAM 운영관리 화면과 수집할 사이트에 로그인한 탭을 같은 Chrome 창에 열어주세요. 수집은 운영관리의 버튼에서 시작합니다.</p><p>회사코드가 일치하지 않거나 응답 구조를 확인하지 못하면 원장에 반영하지 않습니다.</p><p>거래명세서 승인은 확장 전용 확인 창에서 회사와 발주번호를 확인한 뒤 직접 승인해야 실행됩니다.</p><p><a href="https://sourceflow.jjwwhhjj1116.workers.dev/operations" target="_blank" rel="noreferrer">YOOFAM 운영관리 열기</a></p></body></html>
